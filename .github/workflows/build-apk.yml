name: HEX PULSE V4.7 - Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Open the supplied game project
        run: |
          test -f HEX_PULSE_V47_ANDROID_APK_KAYNAK.zip || { echo 'Oyun ZIP dosyasi eksik'; exit 1; }
          unzip -t HEX_PULSE_V47_ANDROID_APK_KAYNAK.zip | tail -2
          mkdir -p project
          unzip -q -o HEX_PULSE_V47_ANDROID_APK_KAYNAK.zip -d project
          test -f project/app/src/main/assets/index.html
          test -f project/app/build.gradle
          test -f project/app/src/main/java/com/hexpulse/arcade/MainActivity.java

      - name: Check game JavaScript and offline configuration
        run: |
          python3 project/test_project.py

      - name: Compile Android debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK exists and calculate digest
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          cp project/app/build/outputs/apk/debug/app-debug.apk ./HEX-PULSE-V47-test.apk
          sha256sum HEX-PULSE-V47-test.apk > APK_SHA256.txt

      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HEX-PULSE-V47-ANDROID-APK
          path: |
            HEX-PULSE-V47-test.apk
            APK_SHA256.txt
          if-no-files-found: error

name: HEX PULSE V4.7 - Acilis Onarim APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-startup-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack the corrected HEX PULSE Android source
        run: |
          test -f HEX_PULSE_ANDROID_ACILIS_FIX_V47.zip || { echo 'Acilis onarim ZIP eksik'; exit 1; }
          unzip -t HEX_PULSE_ANDROID_ACILIS_FIX_V47.zip | tail -2
          mkdir -p project
          unzip -q -o HEX_PULSE_ANDROID_ACILIS_FIX_V47.zip -d project
          test -f project/app/src/main/java/com/hexpulse/arcade/MainActivity.java
          test -f project/app/src/main/assets/index.html

      - name: Check preserved game HTML and Android project
        run: |
          python3 project/test_project.py
          grep -q 'loadDataWithBaseURL' project/app/src/main/java/com/hexpulse/arcade/MainActivity.java
          grep -q 'onRenderProcessGone' project/app/src/main/java/com/hexpulse/arcade/MainActivity.java

      - name: Build new Android debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          cp project/app/build/outputs/apk/debug/app-debug.apk HEX-PULSE-STARTUP-FIX.apk
          sha256sum HEX-PULSE-STARTUP-FIX.apk > APK_SHA256.txt

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: HEX-PULSE-STARTUP-FIX
          path: |
            HEX-PULSE-STARTUP-FIX.apk
            APK_SHA256.txt
          if-no-files-found: error

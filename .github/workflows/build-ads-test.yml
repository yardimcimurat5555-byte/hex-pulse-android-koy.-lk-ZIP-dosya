name: HEX PULSE V5.0 - AdMob TEST (2 Olum)
run-name: HEX PULSE V5.0 - Reklamli Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ads-test.yml'
      - 'HEX_PULSE_V50_ADMOB_TEST_SOURCE.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract AD TEST source only
        run: |
          set -eu
          test -s HEX_PULSE_V50_ADMOB_TEST_SOURCE.zip
          mkdir -p build-v50
          unzip -q HEX_PULSE_V50_ADMOB_TEST_SOURCE.zip -d build-v50
      - name: Validate
        run: |
          python3 build-v50/test_project.py
          grep -q "com.hexpulse.arcade.violetads" build-v50/app/build.gradle
      - name: Build debug APK
        working-directory: build-v50
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Export debug APK
        run: |
          test -s build-v50/app/build/outputs/apk/debug/app-debug.apk
          cp build-v50/app/build/outputs/apk/debug/app-debug.apk HEX-PULSE-V50-ADMOB-TEST.apk
          sha256sum HEX-PULSE-V50-ADMOB-TEST.apk > SHA256-V50.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEX-PULSE-V50-TEST-ADS-APK
          path: |
            HEX-PULSE-V50-ADMOB-TEST.apk
            SHA256-V50.txt
          if-no-files-found: error
